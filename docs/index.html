:root{--bg:#fff;--text:#202b2b;--muted:#687676;--line:#e5eaea;--soft:#f7f9f9;--accent:#08786a;--tint:#edf8f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 'DM Sans',sans-serif}button,input{font:inherit}a{color:inherit;text-decoration:none}button,a,input{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:0 32px;position:sticky;top:0;background:var(--bg);z-index:20}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.8px;white-space:nowrap}.logo{width:29px;height:29px;background:#173e37;color:#8ce4bd;display:grid;place-items:center;border-radius:7px;font-family:monospace;font-size:24px}.version{font:11px 'IBM Plex Mono',monospace;color:var(--muted);border:1px solid var(--line);padding:4px 7px;border-radius:5px;margin-left:4px}.toplinks{display:flex;gap:25px;margin-left:30px;height:100%;align-items:center;font-size:13px}.toplinks a:first-child{border-bottom:2px solid var(--accent);height:100%;display:flex;align-items:center;color:var(--accent)}.searchTrigger{margin-left:auto;width:260px;text-align:left;background:var(--soft);border:1px solid var(--line);color:var(--muted);padding:8px 12px;border-radius:7px;display:flex;align-items:center;gap:10px;font-size:13px}kbd{font:11px 'IBM Plex Mono';border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:auto}.github{font-size:13px;white-space:nowrap}.menu{display:none;background:none;border:0;font-size:23px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1600px;margin:auto}.sidebar{border-right:1px solid var(--line);padding:32px 20px 24px 26px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto;display:flex;flex-direction:column}.navgroup{font-size:11px;letter-spacin top:112px;height:fit-content;font-size:12px;padding-top:7px}.toc strong{display:block;font-size:11px;font-weight:600;margin-bottom:15px}.toc a{display:block;border-left:1px solid var(--line);padding:6px 0 6px 14px;color:var(--muted)}.toc a:hover{color:var(--accent);border-color:var(--accent)}.toc .help{border-top:1px solid var(--line);margin-top:30px;padding-top:20px;color:var(--muted);font-size:11px}.help a{border:0;padding:6px 0;color:var(--accent)}footer{border-top:1px solid var(--line);margin-top:34px;padding-top:18px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:12px}.next{border:1px solid var(--line);padding:16px 20px;border-radius:8px;display:block;text-align:right;margin:25px 0}.next small{display:block;color:var(--muted);font-size:11px}.next strong{font-size:14px;font-weight:500;color:var(--accent)}table{border-collapse:collapse;width:100%;font-size:12px;margin:18px 0}th,td{text-align:left;padding:13px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--soft);font-weight:500}td{color:var(--muted)}li{color:var(--muted);margin:7px 0}.get{font:10px 'IBM Plex Mono';color:var(--accent);background:var(--tint);padding:3px 5px;margin-right:8px;border-radius:4px}.endpoint{padding:16px;border:1px solid var(--line);border-radius:7px;margin:12px 0}.endpoint p{font-size:13px;margin-bottom:0}.endpoint code{border:0;background:none}.tablewrap{overflow-x:auto}dialog{padding:0;border:1px solid var(--line);border-radius:12px;width:min(600px,90vw);color:var(--text);box-shadow:0 30px 90px #0003}dialog::backdrop{background:#14282066;backdrop-filter:blur(3px)}.searchbar{display:flex;border-bottom:1px solid var(--line);padding:17px;gap:12px}.searchbar input{border:0;outline:0;width:100%;background:transparent;color:inherit}.searchbar button{border:0;background:var(--soft);border-radius:4px;color:var(--muted)}#results{padding:10px;max-height:55vh;overflow:auto}#results a{display:block;padding:12px;border-radius:6px}#results a:hover{background:var(--tint)}#results small{display:block;color:var(--muted)}.skip{position:fixed;top:-100px;background:var(--bg);padding:10px;z-index:40}.skip:focus{top:0}@media(min-width:1450px){.workspace{padding-top:46px}}@media(max-width:1150px){.workspace{grid-template-columns:minmax(0,1fr);padding:35px}.toc{display:none}.toplinks{margin-left:0}.searchTrigger{width:220px}}@media(max-width:850px){header{padding:0 20px;gap:15px;height:65px}.toplinks{display:none}.layout{grid-template-columns:205px 1fr}.sidebar{top:65px;height:calc(100vh - 65px);padding-left:12px;padding-right:12px}.workspace{padding:30px 25px}.brand{font-size:17px}.version{display:none}.searchTrigger{width:190px}h1{font-size:36px}.cards{grid-template-columns:1fr}.flow{gap:5px}.node{padding:12px 8px}.architecture{padding:18px 12px}}@media(max-width:650px){.menu{display:block}.github{display:none}.searchTrigger{width:36px;padding:7px;justify-content:center}.searchTrigger span,.searchTrigger kbd{display:none}.layout{display:block}.sidebar{display:none;position:fixed;top:65px;left:0;width:250px;z-index:19;background:var(--bg);box-shadow:20px 0 45px #0002}.sidebar.open{display:flex}.workspace{padding:26px 22px}.breadcrumb{margin-bottom:25px}h1{font-size:36px}.lead{font-size:16px}.flow{flex-direction:column}.node{width:100%}.arrow{transform:rotate(90deg)}.actions{flex-wrap:wrap}.cards{grid-template-columns:1fr}.architecture{padding:20px}.sidebarfoot{margin-top:30px}footer{flex-direction:column}.tag{font-size:10px}}
</style></head><body><a class="skip" href="#main">Skip to content</a><header><button class="menu" aria-label="Toggle navigation" aria-expanded="false">☰</button><a href="#overview" class="brand"><span class="logo" aria-hidden="true">⌘</span>mcp-netdisco <span class="version">v0.2.0</span></a><nav class="toplinks"><a href="#overview">Documentation</a><a href="https://github.com/AngelN-Halo/mcp-netdisco/blob/main/CHANGELOG.md" target="_blank" rel="noopener noreferrer">Changelog ↗</a></nav><button class="searchTrigger" aria-label="Search documentation">⌕ <span>Search documentation…</span><kbd>⌘ K</kbd></button><a class="github" href="https://github.com/AngelN-Halo/mcp-netdisco" target="_blank" rel="noopener noreferrer">GitHub ↗</a></header><div class="layout"><nav class="sidebar" aria-label="Documentation"></nav><div class="workspace"><main id="main" class="content" tabindex="-1"></main><aside class="toc" aria-label="On this page"></aside></div></div><dialog id="searchDialog"><div class="searchbar"><input id="searchInput" type="search" placeholder="Search the documentation…" aria-label="Search query"><button id="closeSearch" aria-label="Close search">Esc</button></div><div id="results"></div></dialog><div id="announce" aria-live="polite" style="position:absolute;left:-10000px"></div><script>
const repo='https://github.com/AngelN-Halo/mcp-netdisco';
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const code=(s,label='terminal')=>`<div class="codebox"><div class="codehead"><span>${label}</span><button class="copy" aria-label="Copy ${label} code">Copy ⧉</button></div><pre><code>${esc(s)}</code></pre></div>`;
const note=s=>`<div class="note"><span aria-hidden="true">ⓘ</span><p>${s}</p></div>`;
const card=(id,icon,title,text)=>`<a class="card" href="#${id}"><div class="cardicon">${icon}</div><h3>${title}<span>↗</span></h3><p>${text}</p></a>`;
const request=`curl --get 'https://netdisco-gateway.example.com/lookup' \\\n  --header "Authorization: Bearer $MCPO_API_KEY" \\\n  --data-urlencode 'query=192.0.2.10'`;
const env=`NETDISCO_URL=http://your-netdisco-server:5000\nNETDISCO_USERNAME=your-netdisco-username\nNETDISCO_PASSWORD=your-netdisco-password\nMCPO_API_KEY=replace-with-a-long-random-secret\nNETDISCO_TIMEOUT=20`;
const pages={
overview:{title:'Your network. One lookup.',nav:'Introduction',group:'Getting started',icon:'◈',description:'A read-only bridge between Open WebUI and Netdisco. Find endpoints, trace switch ports, and explore your network through a single OpenAPI gateway.',body:()=>`<div class="tags"><span>● Read-only by design</span><span>Docker ready</span><span>OpenAPI compatible</span></div><div class="actions"><a class="btn primary" href="#quickstart">Start building <span>→</span></a><a class="btn" href="#api">Explore the API <span>↗</span></a></div><div class="architecture"><div class="smalllabel">A small bridge. A clearer network.</div><div class="flow"><div class="node"><strong>Open WebUI</strong><small>Your interface</small></div><span class="arrow">→</span><div class="node selected"><strong>mcp-netdisco</strong><small>Read-only gateway</small></div><span class="arrow">→</span><div class="node"><strong>Netdisco</strong><small>Your network data</small></div></div><div class="flowcaption">Bearer-protected OpenAPI · Automatic upstream authentication</div></div><h2 id="possibilities">Less searching. More context.</h2><p>Go from an identifier to the network details that matter.</p><div class="cards">${card('lookup','⌕','Look up anything','Search an IP, MAC address, hostname, switch, or router from one endpoint.')}${card('lookup','⇄','Trace the connection','Follow endpoint sightings to switch ports, VLANs, and interface configuration.')}${card('integration','⌘','Connect to Open WebUI','Bring network context into your workspace with an OpenAPI connection.')}${card('security','▣','Keep access read-only','Query network data without exposing configuration-changing operations.')}</div><h2 id="first-request">Make your first lookup</h2><p>Use <code>GET /lookup</code> for everyday searches. Supply your gateway URL and a bearer token.</p>${code(request)}${note('Despite its name, this project exposes an <strong>OpenAPI gateway</strong>. In Open WebUI, add it as an OpenAPI connection—not a native MCP transport.')}<a class="next" href="#quickstart"><small>Up next</small><strong>Quickstart →</strong></a>`},
quickstart:{title:'Up and running.',nav:'Quickstart',group:'Getting started',icon:'↗',description:'Deploy the gateway with Docker, connect your Netdisco instance, and make your first authenticated request.',body:()=>`<h2 id="prerequisites">Before you begin</h2><ul><li>Docker Engine with Docker Compose installed.</li><li>A reachable Netdisco instance and valid username/password.</li><li>Nginx Proxy Manager on the external Docker network named proxy.</li><li>A hostname and HTTPS proxy configured for your gateway.</li></ul><h2 id="clone">1. Get the project</h2>${code('git clone https://github.com/AngelN-Halo/mcp-netdisco.git\ncd mcp-netdisco\ncp .env.example .env')}<h2 id="configure">2. Set your environment</h2><p>Edit your local <code>.env</code>. Replace all example values, including the Netdisco URL.</p>${code(env,'.env')}${note('Keep <code>.env</code> out of version control. Use a long, random secret for <code>MCPO_API_KEY</code>.')}<h2 id="deploy">3. Start the container</h2><p>Confirm that the external network exists. If it does not, create it and attach your reverse proxy to the same network.</p>${code('docker network inspect proxy\n# Only if the network is missing:\ndocker network create proxy\n\ndocker compose up -d --build')}<p>The service exposes port 8000 inside the Docker network only. It does not publish a port on your host.</p><h2 id="connect">4. Connect your client</h2><p>Follow <a href="#deployment">the reverse-proxy setup →</a>, then add the HTTPS gateway URL and bearer token in <a href="#integration">Open WebUI →</a>.</p><h2 id="test">5. Try a lookup</h2><p>Set MCPO_API_KEY in your local shell and replace the example URL and IP with your own.</p>${code(request)}<a class="next" href="#configuration"><small>Up next</small><strong>Configuration →</strong></a>`},
configuration:{title:'Configuration',nav:'Configuration',group:'Getting started',icon:'⚙',description:'A few environment variables connect the gateway to your network. Keep credentials local and out of source control.',body:()=>`<h2 id="environment">Environment variables</h2>${code(env,'.env')}<div class="tablewrap"><table><thead><tr><th>Variable</th><th>Purpose</th></tr></thead><tbody><tr><td><code>NETDISCO_URL</code></td><td>Your upstream Netdisco base URL. Set explicitly.</td></tr><tr><td><code>NETDISCO_USERNAME</code></td><td>Required upstream login username.</td></tr><tr><td><code>NETDISCO_PASSWORD</code></td><td>Required upstream login password.</td></tr><tr><td><code>MCPO_API_KEY</code></td><td>Required gateway bearer secret.</td></tr><tr><td><code>NETDISCO_TIMEOUT</code></td><td>Upstream request timeout; default 20 seconds.</td></tr></tbody></table></div><h2 id="binding">Container binding</h2><p>The supplied Compose configuration fixes <code>API_HOST=0.0.0.0</code> and <code>API_PORT=8000</code>. Editing API_PORT in .env alone does not override that Compose setting.</p>${note('The repository example contains a site-specific upstream URL. Replace it with your own Netdisco address before deployment.')}<h2 id="auth">Two separate credentials</h2><p>The Netdisco username and password obtain an upstream API key. Clients use MCPO_API_KEY to authenticate to this gateway; they do not receive your upstream password.</p>`},
deployment:{title:'Docker & reverse proxy',nav:'Docker deployment',group:'Guides',icon:'▧',description:'Keep the container private on a shared Docker network and route client traffic through an HTTPS reverse proxy.',body:()=>`<h2 id="network">The proxy network</h2><p>The supplied Compose service joins an existing external network named <code>proxy</code>. Nginx Proxy Manager must be able to reach the gateway on that network.</p>${code('docker compose up -d --build\ndocker compose ps\ndocker compose logs --tail=100')}<h2 id="proxy">Nginx Proxy Manager</h2><div class="tablewrap"><table><tr><th>Setting</th><th>Value</th></tr><tr><td>Forward hostname</td><td><code>mcp-netdisco</code></td></tr><tr><td>Forward port</td><td><code>8000</code></td></tr><tr><td>Scheme</td><td><code>http</code></td></tr></table></div><p>Configure your public or internal DNS name and an appropriate TLS certificate at the proxy. Give clients the resulting HTTPS URL.</p><h2 id="verify">Verify access</h2>${code("curl 'https://netdisco-gateway.example.com/health'") }<p>The health response is <code>{"status":"ok"}</code>. This checks gateway liveness, not upstream Netdisco connectivity.</p>${note('No host port is published by the supplied Compose file. A failed request to localhost:8000 does not necessarily mean the container is down.')}`},
integration:{title:'Connect Open WebUI',nav:'Open WebUI',group:'Guides',icon:'⌘',description:'Make Netdisco lookups available through an OpenAPI connection without sharing upstream credentials with the client.',body:()=>`<h2 id="connection">Add an OpenAPI connection</h2><ol><li>Deploy the gateway and confirm your HTTPS URL is reachable from Open WebUI.</li><li>Add that URL as an OpenAPI connection in your Open WebUI installation.</li><li>Use the value of <code>MCPO_API_KEY</code> as the bearer token.</li><li>The gateway schema is available at <code>/openapi.json</code>.</li></ol>${note('Open WebUI navigation varies by version. The connection type should be <strong>OpenAPI</strong>.')}<h2 id="tools">Recommended operation</h2><p>Use <code>lookup_identifier</code> for normal searches. It combines endpoint information and managed-device matches, then adds switch-port context.</p><h2 id="example">Example requests to your assistant</h2><div class="endpoint">“Find the switch port associated with 192.0.2.10.”</div><div class="endpoint">“Look up the MAC address 9cf6.1a86.0e0c.”</div><p>These are illustrative prompts, not live query results. Available data depends on your Netdisco inventory.</p>`},
lookup:{title:'One identifier. Full context.',nav:'Identifier lookup',group:'Guides',icon:'⌕',description:'Start with an IP address, MAC address, hostname, switch, or router. The gateway brings endpoint and infrastructure context together.',body:()=>`<h2 id="identifiers">Accepted identifiers</h2><div class="tablewrap"><table><tr><th>Type</th><th>Example</th></tr><tr><td>IPv4 address</td><td><code>192.0.2.10</code></td></tr><tr><td>IEEE MAC</td><td><code>9c:f6:1a:86:0e:0c</code></td></tr><tr><td>Cisco MAC</td><td><code>9cf6.1a86.0e0c</code></td></tr><tr><td>Hostname / managed device</td><td><code>switch.example.com</code></td></tr></table></div><p>Cisco MAC notation is normalized automatically. Full and partial MAC matching are supported.</p><h2 id="request">Send a lookup</h2>${code(request)}<h2 id="response">Read the response</h2><ul><li><code>node_results</code>: endpoint search records.</li><li><code>device_results</code>: managed switch and router matches.</li><li><code>switch_port_sightings</code>: observed endpoint locations.</li><li><code>port_details</code>: available switch-port configuration.</li></ul><p>Port details may include VLAN/PVID, interface descriptions, admin and operational state, speed, duplex, MTU, neighbors, and timestamps.</p><h2 id="limits">Bounded enrichment</h2><p>Broad searches enrich at most <strong>20 matching MAC addresses</strong> and <strong>25 unique switch ports</strong>. Check <code>limits.results_truncated</code> and narrow your query when it is true.</p>${note('Partial matching and port enrichment default to true. Use <code>partial=false</code> for exact matching or <code>include_port_details=false</code> to skip port configuration enrichment.')}`},
api:{title:'API reference',nav:'Endpoints',group:'Reference',icon:'{ }',description:'Five read-only endpoints. All data endpoints require bearer authentication; the health check is unauthenticated.',body:()=>`<h2 id="authentication">Authentication</h2>${code('Authorization: Bearer <MCPO_API_KEY>','HTTP header')}<h2 id="endpoints">Endpoints</h2>${[['/lookup','lookup_identifier','Preferred universal lookup. Searches endpoints and managed devices.'],['/find-node','find_endpoint_node','Endpoint IP/MAC lookup with switch-port enrichment.'],['/find-device','find_managed_network_device','Search managed switches and routers only.'],['/device/{ip}','get_managed_device_details','Details for a known managed switch or router; not an endpoint/client IP.'],['/health','health_check','Unauthenticated gateway liveness check. Returns {"status":"ok"}.']].map(([path,op,d])=>`<div class="endpoint"><span class="get">GET</span><code>${path}</code><p>${d}</p><p><code>${op}</code></p></div>`).join('')}<h2 id="parameters">Query parameters</h2><p>Both <code>/lookup</code> and <code>/find-node</code> accept:</p><div class="tablewrap"><table><tr><th>Name</th><th>Type</th><th>Default</th></tr><tr><td><code>query</code></td><td>string</td><td>Required</td></tr><tr><td><code>partial</code></td><td>boolean</td><td>true</td></tr><tr><td><code>include_port_details</code></td><td>boolean</td><td>true</td></tr></table></div><p><code>/find-device</code> requires a string <code>query</code>. The device-details endpoint takes <code>ip</code> as a path parameter.</p><h2 id="schema">OpenAPI schema</h2><p>Read the deployed gateway’s <code>/openapi.json</code> for its generated schema. This documentation preview does not make live API requests.</p>`},
security:{title:'Read-only by design.',nav:'Security',group:'Reference',icon:'▣',description:'The gateway reads network inventory. Protect the credentials and the network context it makes available.',body:()=>`<h2 id="access">Access boundaries</h2><p>All data endpoints require the MCPO_API_KEY bearer token. The gateway does not provide configuration-changing operations. Its health endpoint is unauthenticated.</p><h2 id="upstream">Upstream authentication</h2><p>Netdisco credentials are used to obtain an upstream API key. The gateway automatically renews that key and retries after an upstream HTTP 401.</p><h2 id="practice">Deployment recommendations</h2><ul><li>Never commit .env or include real credentials in documentation.</li><li>Choose a strong gateway secret and share it only with authorized clients.</li><li>Use HTTPS between clients and the reverse proxy.</li><li>Restrict network access to the intended users and services.</li><li>Treat inventory, hostnames, MAC addresses, and port details as sensitive operational data.</li></ul>${note('Read-only does not mean public. Bearer authentication protects access to your network information.')}<h2 id="license">License status</h2><p>The repository README states that no license has been selected yet. Public source availability does not itself grant an open-source license.</p>`}
};
Object.values(pages).forEach(p=>p.html=p.body());
const sidebar=document.querySelector('.sidebar');let group='';sidebar.innerHTML=Object.entries(pages).map(([id,p])=>{let heading=p.group!==group?`<div class="navgroup">${p.group}</div>`:'';group=p.group;return heading+`<a class="navlink" href="#${id}" data-page="${id}"><span class="navicon" aria-hidden="true">${p.icon}</span>${p.nav}</a>`}).join('')+`<div class="sidebarfoot"><strong>Built for network clarity.</strong>A small gateway to your infrastructure.<br><a href="${repo}" target="_blank" rel="noopener noreferrer">View source on GitHub ↗</a></div>`;
function render(){const id=location.hash.slice(1).split('/')[0]||'overview';if(!pages[id])return;const p=pages[id];document.title=p.nav+' — mcp-netdisco';document.querySelector('#main').innerHTML=`<div class="breadcrumb">Docs <span>›</span> ${p.group} <span>›</span><span>${p.nav}</span></div><div class="eyebrow">${id==='overview'?'Network intelligence, connected':p.group}</div><h1>${p.title}</h1><p class="lead">${p.description}</p>${p.html}<footer><span>mcp-netdisco · Documentation</span><a href="${repo}/blob/main/README.md" target="_blank" rel="noopener noreferrer">Source documentation ↗</a></footer>`;document.querySelectorAll('.tags span').forEach(el=>el.classList.add('tag'));document.querySelectorAll('.navlink').forEach(a=>{a.classList.toggle('active',a.dataset.page===id);a.setAttribute('aria-current',a.dataset.page===id?'page':'false')});document.querySelector('.toc').innerHTML='<strong>On this page</strong>'+[...document.querySelectorAll('h2[id]')].map(h=>`<a href="#${id}/${h.id}" data-section="${h.id}">${h.textContent}</a>`).join('')+`<div class="help">Make these docs better.<a href="${repo}/issues" target="_blank" rel="noopener noreferrer">Open an issue ↗</a><a href="${repo}/blob/main/README.md" target="_blank" rel="noopener noreferrer">View source ↗</a></div>`;sidebar.classList.remove('open');document.querySelector('.menu').setAttribute('aria-expanded','false');const section=location.hash.split('/')[1];if(section)document.getElementById(section)?.scrollIntoView();else window.scrollTo(0,0);}
window.addEventListener('hashchange',render);render();
document.querySelector('.menu').onclick=e=>{let open=sidebar.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',open)};
document.addEventListener('click',async e=>{const b=e.target.closest('.copy');if(!b)return;const text=b.closest('.codebox').querySelector('code').textContent;try{await navigator.clipboard.writeText(text);b.textContent='Copied ✓';document.querySelector('#announce').textContent='Code copied';}catch{const range=document.createRange();range.selectNodeContents(b.closest('.codebox').querySelector('code'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);b.textContent='Selected — use Ctrl/Cmd+C';} });
const dialog=document.querySelector('#searchDialog'),input=document.querySelector('#searchInput');function search(){let q=input.value.trim().toLowerCase();let matches=Object.entries(pages).filter(([id,p])=>(p.title+' '+p.nav+' '+p.description+' '+p.html.replace(/<[^>]*>/g,' ')).toLowerCase().includes(q));document.querySelector('#results').innerHTML=matches.length?matches.map(([id,p])=>`<a href="#${id}"><strong>${p.nav}</strong><small>${p.description}</small></a>`).join(''):'<p style="padding:12px">No matching pages. Try “Docker”, “MAC”, or “token”.</p>';}function openSearch(){dialog.showModal();input.value='';search();input.focus()}document.querySelector('.searchTrigger').onclick=openSearch;document.querySelector('#closeSearch').onclick=()=>dialog.close();input.oninput=search;document.querySelector('#results').onclick=e=>{if(e.target.closest('a'))dialog.close()};dialog.onclick=e=>{if(e.target===dialog)dialog.close()};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){sidebar.classList.remove('open');document.querySelector('.menu').setAttribute('aria-expanded','false')}});
</script></body></html>
