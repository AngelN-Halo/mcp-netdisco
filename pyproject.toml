[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-netdisco"
version = "0.2.0"
description = "OpenAPI gateway for read-only Netdisco access"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn[standard]>=0.30,<1"]

[project.scripts]
mcp-netdisco = "mcp_netdisco.server:main"

[tool.setuptools.packages.find]
include = ["mcp_netdisco*"]
