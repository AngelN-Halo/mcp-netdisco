[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcn-netdisco"
version = "0.1.0"
description = "MCP server for Netdisco"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.0,<2",
]

[project.scripts]
mcn-netdisco = "mcn_netdisco.server:main"

[tool.setuptools.packages.find]
include = ["mcn_netdisco*"]
